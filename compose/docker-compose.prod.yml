services:
  stock_options:
    build:
      context: https://github.com/jwplatta/tickrake.git#main
    image: tickrake:latest
    env_file:
      - ../env/secrets.env
      - ../env/prod.env
    environment:
      TICKRAKE_JOB: stock_options
    volumes:
      - ~/.tickrake:/root/.tickrake
      - ~/.schwab_rb:/root/.schwab_rb
      - ~/.aws:/root/.aws:ro
    restart: unless-stopped

