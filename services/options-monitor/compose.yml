services:
  options_monitor:
    build:
      context: https://github.com/jwplatta/options-monitor.git#main
    env_file:
      - envs/${ENV}.env
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_INTRADAY_BUCKET: tickrake-intraday
      MINIO_HISTORICAL_BUCKET: tractatus-lakehouse
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      TRACTATUS_CACHE_DIR: /root/.tractatus/cache
    volumes:
      - ~/.tractatus/cache:/root/.tractatus/cache
      - ~/.aws:/root/.aws:ro
    depends_on:
      - minio
    restart: unless-stopped
