    depends_on:
      - minio
    environment:
      <<: *tickrake-environment
      TICKRAKE_JOB_FILE: /jobs/prod/intraday_publisher.rb

  economic_events:
    <<: *tickrake-base
    profiles: [dev, prod, data-ingestion]
