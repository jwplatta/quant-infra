timezone: America/Chicago

# Database Configuration (Rails ActiveRecord convention)
database:
  adapter: <%= ENV.fetch('TICKRAKE_DB_ADAPTER', 'postgresql') %>
  host: <%= ENV.fetch('TICKRAKE_DB_HOST', 'postgres') %>
  port: <%= ENV.fetch('TICKRAKE_DB_PORT', 5432) %>
  database: <%= ENV.fetch('TICKRAKE_DB_NAME', 'tickrake') %>
  user: <%= ENV.fetch('TICKRAKE_DB_USER', 'tickrake_user') %>
  password: <%= ENV.fetch('PGPASSWORD', ENV.fetch('TICKRAKE_DB_PASSWORD', '')) %>

# Target Datastores (MinIO or S3)
staging_target:
  type: <%= ENV.fetch('STAGING_DATASTORE_TYPE', 's3_compatible') %>
  endpoint: <%= ENV.fetch('MINIO_ENDPOINT', 'http://minio:9000') %>
  bucket: <%= ENV.fetch('TICKRAKE_STAGING_BUCKET', 'tickrake-staging') %>
  access_key_id: <%= ENV.fetch('MINIO_ACCESS_KEY', 'minioadmin') %>
  secret_access_key: <%= ENV.fetch('MINIO_SECRET_KEY', 'minioadmin') %>

intraday_target:
  type: <%= ENV.fetch('INTRADAY_DATASTORE_TYPE', 's3_compatible') %>
  endpoint: <%= ENV.fetch('MINIO_ENDPOINT', 'http://minio:9000') %>
  bucket: <%= ENV.fetch('TICKRAKE_INTRADAY_BUCKET', 'tickrake-intraday') %>
  access_key_id: <%= ENV.fetch('MINIO_ACCESS_KEY', 'minioadmin') %>
  secret_access_key: <%= ENV.fetch('MINIO_SECRET_KEY', 'minioadmin') %>

storage:
  data_dir: <%= ENV.fetch('TICKRAKE_DATA_DIR', '~/.tickrake/data') %>

default_provider: ibkr-paper
providers:
  tickrake:
    adapter: ibkr
    settings:
      host: 127.0.0.1
      port: 4002
      client_id: 1001
      historical_timeout_seconds: 120
  massive:
    adapter: massive
    settings: {}
  schwab:
    adapter: schwab
    settings:
      restart_after_consecutive_failures: 5
      restart_cooldown_seconds: 10
      # rate_limit_max_requests: 120
      # rate_limit_interval_seconds: 60
    symbol_map:
      /6E: ^6E
      /CL: ^CL
      /ES: ^ES
      /HG: ^HG
      /GC: ^GC
      /NG: ^NG
      /NQ: ^NQ
      /RTY: ^RTY
      /SI: ^SI
      /YM: ^YM
      /ZB: ^ZB
      /ZC: ^ZC
      /ZN: ^ZN
      /ZS: ^ZS
      /ZW: ^ZW

  ibkr-paper:
    adapter: ibkr
    settings:
      host: 127.0.0.1
      port: 4002
      client_id: 1001
      historical_timeout_seconds: 120
  ibkr-live:
    adapter: ibkr
    settings:
      host: 127.0.0.1
      port: 4001
      client_id: 1000
      historical_timeout_seconds: 120

options:
  snapshot_filename_timezone: utc
  root_tickers:
    SPXW: SPX

runtime:
  max_workers: 4
  retry_count: 3
  retry_delay_seconds: 5
  option_fetch_timeout_seconds: 60
  candle_fetch_timeout_seconds: 1800

universes:
  file: universes.yml
