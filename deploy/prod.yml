name: quant-infra-prod

services:
  options_monitor:
    ports:
      - "8503:8501"

  stock_options:
    depends_on:
      postgres:
        condition: service_healthy
    build:
      context: https://github.com/jwplatta/tickrake.git#main
    volumes:
      - ./services/tickrake/jobs:/jobs:ro
      - ~/.tickrake:/root/.tickrake
      - ~/.schwab_rb:/root/.schwab_rb
      - ~/.aws:/root/.aws:ro

  etf_options:
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./services/tickrake/jobs:/jobs:ro
      - ~/.tickrake:/root/.tickrake
      - ~/.schwab_rb:/root/.schwab_rb
      - ~/.aws:/root/.aws:ro

  0-1dte_options:
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./services/tickrake/jobs:/jobs:ro
      - ~/.tickrake:/root/.tickrake
      - ~/.schwab_rb:/root/.schwab_rb
      - ~/.aws:/root/.aws:ro

  index_short_dated_options:
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./services/tickrake/jobs:/jobs:ro
      - ~/.tickrake:/root/.tickrake
      - ~/.schwab_rb:/root/.schwab_rb
      - ~/.aws:/root/.aws:ro

  index_longer_dated_options:
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./services/tickrake/jobs:/jobs:ro
      - ~/.tickrake:/root/.tickrake
      - ~/.schwab_rb:/root/.schwab_rb
      - ~/.aws:/root/.aws:ro

  futures_candles:
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./services/tickrake/jobs:/jobs:ro
      - ~/.tickrake:/root/.tickrake
      - ~/.schwab_rb:/root/.schwab_rb
      - ~/.aws:/root/.aws:ro

  market_streams:
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./services/tickrake/jobs:/jobs:ro
      - ~/.tickrake:/root/.tickrake
      - ~/.schwab_rb:/root/.schwab_rb
      - ~/.aws:/root/.aws:ro

  metadata_sync:
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./services/tickrake/jobs:/jobs:ro
      - ~/.tickrake:/root/.tickrake

  intraday_publisher:
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./services/tickrake/jobs:/jobs:ro
      - ~/.tickrake:/root/.tickrake

  # TODO
  # staging_publisher:
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   volumes:
  #     - ./services/tickrake/jobs:/jobs:ro
  #     - ~/.tickrake:/root/.tickrake

  economic_events:
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./services/tickrake/jobs:/jobs:ro
      - ~/.tickrake:/root/.tickrake
      - ~/.aws:/root/.aws:ro

  fundamentals:
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./services/tickrake/jobs:/jobs:ro
      - ~/.tickrake:/root/.tickrake

  alloy:
    volumes:
      - ./services/monitoring/alloy/config-prod.alloy:/etc/alloy/config.alloy:ro
      - ~/.tickrake/logs:/var/log/tickrake:ro
      - ~/.tractatus/logs:/var/log/tractatus:ro

  grafana:
    ports:
      - "3000:3000"

  postgres:
    ports:
      - "5432:5432"

  mlflow:
    ports:
      - "5005:5000"

  minio:
    ports:
      - "9000:9000"
      - "9001:9001"

volumes:
  promtail_positions:
