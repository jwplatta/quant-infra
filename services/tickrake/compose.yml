    profiles: [dev, prod, data-ingestion]
    environment:
      <<: *tickrake-environment
      TICKRAKE_JOB_FILE: /jobs/prod/futures_candles.rb

  events_ingestor:
    <<: *tickrake-base
    profiles: [prod, data-ingestion]
    environment:
      <<: *tickrake-environment
      TICKRAKE_JOB_FILE: /jobs/prod/events_ingestor.rb

  metadata_sync:
    <<: *tickrake-base
    profiles: [prod, data-ingestion]
    environment:
      <<: *tickrake-environment
