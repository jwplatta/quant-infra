      <<: *tickrake-environment
      TICKRAKE_JOB_FILE: /jobs/prod/economic_events.rb

  reconciler:
    <<: *tickrake-base
    profiles: [dev, prod, data-ingestion]
    environment:
      <<: *tickrake-environment
      TICKRAKE_JOB_FILE: /jobs/prod/reconciler.rb
