services:
  storage_metrics_exporter:
    build:
      context: ./services/monitoring/storage_metrics_exporter
    profiles: [dev, prod, data-ingestion]
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      STORAGE_METRICS_REFRESH_SECONDS: "86400"
      STORAGE_METRICS_RETRY_SECONDS: "300"
    depends_on:
      - minio
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.0
    profiles: [dev, prod, data-ingestion]
    volumes:
      - ./services/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped

  loki:
    image: grafana/loki:3.1.0
    profiles: [dev, prod, data-ingestion]
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./services/monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.20.1
    profiles: [dev, prod, data-ingestion]
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    depends_on:
      - loki
    volumes:
      - alloy_data:/var/lib/alloy/data
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.1.0
    profiles: [promtail-fallback]
    command: -config.file=/etc/promtail/promtail.yml
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    profiles: [dev, prod]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DATABASE_TYPE: postgres
      GF_DATABASE_HOST: postgres:5432
      GF_DATABASE_NAME: grafana
      GF_DATABASE_USER: grafana
      GF_DATABASE_PASSWORD: grafana
    volumes:
      - ./services/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - loki
      - prometheus
      - postgres
    restart: unless-stopped

volumes:
  prometheus_data:
  loki_data:
  grafana_data:
  alloy_data:
