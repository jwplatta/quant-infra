x-tickrake: &tickrake-base
  image: tickrake:latest
  env_file:
    - envs/secrets.env
    - envs/${ENV}.env
  volumes:
    - ./services/tickrake/jobs:/jobs:ro
    - ./services/tickrake/config/${ENV}:/config:ro
    - ~/.schwab_rb:/root/.schwab_rb
    - ~/.aws:/root/.aws:ro
  restart: unless-stopped

x-tickrake-environment: &tickrake-environment
  TICKRAKE_CONFIG: /config/tickrake.yml

services:
  stock_options:
    <<: *tickrake-base
    profiles: [prod, data-ingestion]
    environment:
      <<: *tickrake-environment
      TICKRAKE_JOB_FILE: /jobs/prod/stock_options.rb

  equity_level_one:
    <<: *tickrake-base
    profiles: [prod, data-ingestion]
    environment:
      <<: *tickrake-environment
      TICKRAKE_JOB_FILE: /jobs/prod/equity_level_one.rb

  equity_order_book:
    <<: *tickrake-base
    profiles: [prod, data-ingestion]
    environment:
      <<: *tickrake-environment
      TICKRAKE_JOB_FILE: /jobs/prod/equity_order_book.rb

  etf_options:
    <<: *tickrake-base
    profiles: [prod, data-ingestion]
    environment:
      <<: *tickrake-environment
      TICKRAKE_JOB_FILE: /jobs/prod/etf_options.rb

  spx_0dte_options:
