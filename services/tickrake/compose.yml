      <<: *tickrake-environment
      TICKRAKE_JOB_FILE: /jobs/prod/spx_0dte_options.rb

  spx_short_dated_options:
    <<: *tickrake-base
    profiles: [prod, data-ingestion]
    environment:
      <<: *tickrake-environment
      TICKRAKE_JOB_FILE: /jobs/prod/spx_short_dated_options.rb

  spx_longer_dated_options:
    <<: *tickrake-base
    profiles: [prod, data-ingestion]
